name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: 린트, 타입 체크, 테스트, 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node 22 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 린트 실행
        run: npm run lint

      - name: 타입 체크
        run: npm run typecheck

      - name: 테스트 실행
        run: npm test

      - name: 빌드
        run: npm run build
