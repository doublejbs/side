<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #f4f5f7; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; color: #111318; }
    a { color: #3f4f7a; } a:hover { color: #2c3858; }
  </style>
</helmet>
<div style="width: 390px; min-height: 900px; background: #f4f5f7; display: flex; flex-direction: column;">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 56px 20px 12px 20px;">
    <div style="font-size: 20px; font-weight: 700; letter-spacing: 1px;">SIDE</div>
    <div style="width: 40px; height: 40px; border-radius: 12px; background: #ffffff; border: 1px solid #e6e7eb; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111318" stroke-width="1.8"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    </div>
  </div>

  <div style="padding: 16px 20px 18px 20px; display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.5px;">오늘의 이슈</div>
    <div style="font-size: 14px; color: #6c7080;">지금 사람들이 의견을 나누고 있는 질문들</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px;">
    <div style="background: #ffffff; border: 1px solid #e6e7eb; border-radius: 20px; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; gap: 6px;">
        <span style="font-size: 11px; font-weight: 500; padding: 4px 9px; border-radius: 999px; background: #eef0f4; color: #4a4f60;">노동</span>
        <span style="font-size: 11px; font-weight: 500; padding: 4px 9px; border-radius: 999px; background: #eef0f4; color: #4a4f60;">경제</span>
      </div>
      <div style="font-size: 24px; font-weight: 700; line-height: 1.3; letter-spacing: -0.5px; text-wrap: pretty;">주 4.5일제를<br>도입해야 할까?</div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; height: 10px; gap: 3px; border-radius: 6px; overflow: hidden;">
          <div style="width: 57%; background: #4b7c6f; border-radius: 6px;"></div>
          <div style="width: 31%; background: #a0674d; border-radius: 6px;"></div>
          <div style="width: 12%; background: #c9ccd4; border-radius: 6px;"></div>
        </div>
        <div style="display: flex; gap: 14px; font-size: 12px; font-weight: 500;">
          <span style="color: #4b7c6f;">찬성 57%</span><span style="color: #a0674d;">반대 31%</span><span style="color: #8a8f9e;">모르겠음 12%</span>
        </div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 4px;">
        <div style="font-size: 13px; color: #6c7080;"><b style="color: #111318; font-weight: 600;">12,481명</b> 참여</div>
        <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #3f4f7a;">3분 만에 이해하기 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3f4f7a" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></div>
      </div>
    </div>

    <div style="background: #ffffff; border: 1px solid #e6e7eb; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;"><div style="display: flex; gap: 6px;"><span style="font-size: 11px; font-weight: 500; padding: 4px 9px; border-radius: 999px; background: #eef0f4; color: #4a4f60;">에너지</span><span style="font-size: 11px; font-weight: 500; padding: 4px 9px; border-radius: 999px; background: #eef0f4; color: #4a4f60;">환경</span></div><div style="font-size: 12px; color: #8a8f9e;">8,902명</div></div>
      <div style="font-size: 18px; font-weight: 600; line-height: 1.35; letter-spacing: -0.3px;">원전 비중을 확대해야 할까?</div>
      <div style="display: flex; height: 8px; gap: 3px;"><div style="width: 44%; background: #4b7c6f; border-radius: 6px;"></div><div style="width: 41%; background: #a0674d; border-radius: 6px;"></div><div style="width: 15%; background: #c9ccd4; border-radius: 6px;"></div></div>
      <div style="display: flex; gap: 12px; font-size: 12px; color: #6c7080;"><span>찬성 44%</span><span>반대 41%</span><span>모르겠음 15%</span></div>
    </div>

    <div style="background: #ffffff; border: 1px solid #e6e7eb; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;"><div style="display: flex; gap: 6px;"><span style="font-size: 11px; font-weight: 500; padding: 4px 9px; border-radius: 999px; background: #eef0f4; color: #4a4f60;">노동</span><span style="font-size: 11px; font-weight: 500; padding: 4px 9px; border-radius: 999px; background: #eef0f4; color: #4a4f60;">복지</span></div><div style="font-size: 12px; color: #8a8f9e;">6,317명</div></div>
      <div style="font-size: 18px; font-weight: 600; line-height: 1.35; letter-spacing: -0.3px;">정년을 65세까지 연장해야 할까?</div>
      <div style="display: flex; height: 8px; gap: 3px;"><div style="width: 52%; background: #4b7c6f; border-radius: 6px;"></div><div style="width: 29%; background: #a0674d; border-radius: 6px;"></div><div style="width: 19%; background: #c9ccd4; border-radius: 6px;"></div></div>
      <div style="display: flex; gap: 12px; font-size: 12px; color: #6c7080;"><span>찬성 52%</span><span>반대 29%</span><span>모르겠음 19%</span></div>
    </div>

    <div style="background: #ffffff; border: 1px solid #e6e7eb; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;"><div style="display: flex; gap: 6px;"><span style="font-size: 11px; font-weight: 500; padding: 4px 9px; border-radius: 999px; background: #eef0f4; color: #4a4f60;">기술</span><span style="font-size: 11px; font-weight: 500; padding: 4px 9px; border-radius: 999px; background: #eef0f4; color: #4a4f60;">산업</span></div><div style="font-size: 12px; color: #8a8f9e;">5,140명</div></div>
      <div style="font-size: 18px; font-weight: 600; line-height: 1.35; letter-spacing: -0.3px;">AI 규제를 강화해야 할까?</div>
      <div style="display: flex; height: 8px; gap: 3px;"><div style="width: 38%; background: #4b7c6f; border-radius: 6px;"></div><div style="width: 49%; background: #a0674d; border-radius: 6px;"></div><div style="width: 13%; background: #c9ccd4; border-radius: 6px;"></div></div>
      <div style="display: flex; gap: 12px; font-size: 12px; color: #6c7080;"><span>찬성 38%</span><span>반대 49%</span><span>모르겠음 13%</span></div>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; justify-content: space-around; padding: 12px 0 26px 0; background: #ffffff; border-top: 1px solid #e6e7eb;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 72px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111318" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 10h8M8 14h5"></path></svg><span style="font-size: 11px; font-weight: 600;">이슈</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 72px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9a9eab" stroke-width="1.8"><circle cx="12" cy="12" r="8"></circle><path d="M14.5 9.5l-1.5 4-4 1.5 1.5-4z"></path></svg><span style="font-size: 11px; color: #9a9eab;">발견</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 72px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9a9eab" stroke-width="1.8"><circle cx="12" cy="9" r="4"></circle><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"></path></svg><span style="font-size: 11px; color: #9a9eab;">나</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
