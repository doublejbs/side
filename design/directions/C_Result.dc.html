<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; background: #fbf8f3; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; color: #24211d; }
    a { color: #6d6a9c; } a:hover { color: #524f7c; }
    .display { font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif; }
  </style>
</helmet>
<div style="width: 390px; min-height: 1080px; background: #fbf8f3; display: flex; flex-direction: column;">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 24px 8px 20px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#24211d" stroke-width="1.8" stroke-linecap="round"><path d="M15 5l-7 7 7 7"></path></svg>
    <div style="font-size: 12px; color: #7a746b;">주 4.5일제</div>
    <div style="width: 24px;"></div>
  </div>

  <div style="padding: 20px 24px 20px 24px; display: flex; flex-direction: column; gap: 10px;">
    <div style="align-self: flex-start; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: #e4ede6; color: #4f7a63;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4f7a63" stroke-width="2.5" stroke-linecap="round"><path d="M5 12l5 5 9-10"></path></svg>내 선택 · 찬성</div>
    <div class="display" style="font-size: 26px; line-height: 1.3;">12,481명이<br>의견을 남겼어요</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 0 24px;">
    <div style="display: flex; gap: 8px;">
      <div style="flex: 57; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; height: 128px; padding: 16px 14px; border-radius: 22px; background: #e4ede6;"><div style="font-size: 30px; font-weight: 700; color: #4f7a63; letter-spacing: -0.5px;">57%</div><div style="font-size: 12px; color: #4f7a63;">찬성</div></div>
      <div style="flex: 31; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; height: 128px; padding: 16px 14px; border-radius: 22px; background: #f1e4dc;"><div style="font-size: 26px; font-weight: 700; color: #a06b52; letter-spacing: -0.5px;">31%</div><div style="font-size: 12px; color: #a06b52;">반대</div></div>
      <div style="flex: 12; min-width: 68px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; height: 128px; padding: 16px 12px; border-radius: 22px; background: #ecebe7;"><div style="font-size: 20px; font-weight: 700; color: #8b877f;">12%</div><div style="font-size: 12px; color: #8b877f;">모름</div></div>
    </div>

    <div style="background: #ffffff; border-radius: 26px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 28px rgba(60, 50, 30, 0.06);">
      <div class="display" style="font-size: 20px; line-height: 1.4; text-wrap: pretty;">나와 다른 사람들은<br>왜 그렇게 생각할까요?</div>
      <div style="font-size: 13px; line-height: 1.6; color: #7a746b;">반대하는 3,869명이 가장 많이 설득된 주장부터 읽어볼 수 있어요.</div>
      <div style="display: flex; justify-content: center; align-items: center; height: 48px; border-radius: 16px; background: #24211d; color: #ffffff; font-size: 14px; font-weight: 500;">반대 의견 읽어보기</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 12px; padding-bottom: 40px;">
      <div style="display: flex; flex-direction: column; gap: 4px;"><div class="display" style="font-size: 20px;">비슷한 생각을 가진 사람들</div><div style="font-size: 13px; color: #7a746b;">찬성/반대가 아니라 생각의 결로 묶었어요</div></div>

      <div style="background: #ffffff; border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; border: 1.5px solid #6d6a9c;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div style="display: flex; align-items: center; gap: 8px;"><div style="display: flex;"><div style="width: 22px; height: 22px; border-radius: 11px; background: #d9d2e9; border: 2px solid #ffffff;"></div><div style="width: 22px; height: 22px; border-radius: 11px; background: #cfe0d5; border: 2px solid #ffffff; margin-left: -8px;"></div><div style="width: 22px; height: 22px; border-radius: 11px; background: #ead9cf; border: 2px solid #ffffff; margin-left: -8px;"></div></div><span style="font-size: 12px; font-weight: 600; color: #6d6a9c;">나와 가장 가까운 그룹</span></div>
          <div style="font-size: 18px; font-weight: 700;">32%</div>
        </div>
        <div style="font-size: 15px; line-height: 1.55;">노동시간 단축에는 찬성하지만<br>기업 규제에는 신중한 사람들</div>
      </div>
      <div style="background: #ffffff; border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-size: 12px; color: #7a746b;">그룹 B</span><div style="font-size: 18px; font-weight: 700; color: #4f4a43;">27%</div></div>
        <div style="font-size: 15px; line-height: 1.55; color: #3a362f;">제도 취지에는 찬성하지만<br>중소기업 부담을 걱정하는 사람들</div>
      </div>
      <div style="background: #ffffff; border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-size: 12px; color: #7a746b;">그룹 C</span><div style="font-size: 18px; font-weight: 700; color: #4f4a43;">24%</div></div>
        <div style="font-size: 15px; line-height: 1.55; color: #3a362f;">정부 정책보다 기업 자율 결정을<br>선호하는 사람들</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
